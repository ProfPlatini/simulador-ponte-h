<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Montador de Ponte H</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: bancada virtual (placa verde) à esquerda e painel do passo à direita; no celular, bancada em cima e painel embaixo. */
:root {
  --bg: #e8edf0;
  --surface: #ffffff;
  --ink: #12202c;
  --muted: #566775;
  --line: #cdd7de;
  --accent: #0a6c9e;
  --accent-ink: #ffffff;
  --accent-soft: #dcecf5;
  --ok: #167a43;
  --ok-soft: #dff3e7;
  --warn: #8a5300;
  --warn-soft: #fbefd5;
  --bad: #b3261e;
  --bad-soft: #fbe3e0;
  --board: #1d5a45;
  --board-2: #2a7a60;
  --silk: #e6f2ec;
  --tray: rgba(10, 30, 24, .88);
  --font-display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151b; --surface: #16202a; --ink: #e5edf2; --muted: #93a4b1; --line: #29384a;
    --accent: #55b6e8; --accent-ink: #06202f; --accent-soft: #15374a;
    --ok: #4cd08a; --ok-soft: #123524; --warn: #f0b54d; --warn-soft: #3a2b0d;
    --bad: #ff8a80; --bad-soft: #43201d;
    --board: #133a2d; --board-2: #1f5946; --silk: #d8ece3; --tray: rgba(4, 16, 12, .9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151b; --surface: #16202a; --ink: #e5edf2; --muted: #93a4b1; --line: #29384a;
  --accent: #55b6e8; --accent-ink: #06202f; --accent-soft: #15374a;
  --ok: #4cd08a; --ok-soft: #123524; --warn: #f0b54d; --warn-soft: #3a2b0d;
  --bad: #ff8a80; --bad-soft: #43201d;
  --board: #133a2d; --board-2: #1f5946; --silk: #d8ece3; --tray: rgba(4, 16, 12, .9);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; gap: 8px; padding-block: 10px; min-height: 0; }

/* Cabeçalho */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { min-width: 0; }
.eyebrow { font: 500 11px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 700 28px/1 var(--font-display); letter-spacing: .01em; text-wrap: balance; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.pill { font: 500 12px/1 var(--font-mono); padding: 7px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.link-btn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--muted); }
.link-btn:hover { color: var(--ink); border-color: var(--muted); }

/* Trilha de passos */
.steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.step-chip {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px 5px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  font-size: 12.5px; color: var(--muted); white-space: nowrap;
}
.step-chip .n { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 500 11px/1 var(--font-mono); background: var(--bg); color: var(--muted); }
.step-chip.done { color: var(--ink); }
.step-chip.done .n { background: var(--ok); color: #fff; }
.step-chip.cur { border-color: var(--accent); color: var(--ink); box-shadow: 0 0 0 2px var(--accent-soft); }
.step-chip.cur .n { background: var(--accent); color: var(--accent-ink); }
.step-chip:disabled { opacity: .45; cursor: not-allowed; }

/* Área de trabalho */
.work { flex: 1; min-height: 0; display: grid; gap: 10px; grid-template-rows: minmax(40dvh, 1fr) auto; }
.stage { position: relative; min-height: 0; border-radius: 12px; overflow: hidden; background: var(--board); border: 1px solid var(--board-2); display: flex; flex-direction: column; }
.stage.short::after { content: ''; position: absolute; inset: 0; border: 5px solid #ff3b30; border-radius: 12px; pointer-events: none; z-index: 6; }
.bar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; background: var(--tray); }
.bar-title { font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.7); white-space: nowrap; }
.canvas { position: relative; flex: 1 1 0; min-height: 0; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; display: block; }
.tools { display: flex; gap: 5px; flex-wrap: nowrap; }
.tbtn { min-width: 38px; height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; font-size: 13.5px; white-space: nowrap; }
.tbtn:hover { background: rgba(255,255,255,.18); }
.tbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tbtn:disabled { opacity: .4; cursor: not-allowed; }
.status { pointer-events: none; position: absolute; left: 8px; top: 8px; right: 8px; width: fit-content; max-width: calc(100% - 16px); z-index: 3; padding: 7px 11px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 500; }
.toast { pointer-events: none; position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 4; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; line-height: 1.4; background: var(--surface); color: var(--ink); border-left: 5px solid var(--muted); box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.toast.bad { border-left-color: var(--bad); }
.toast.ok { border-left-color: var(--ok); }
.toast.short { background: var(--bad); color: #fff; border-left-color: #fff; font-weight: 600; }
.tray { flex: 0 0 auto; z-index: 3; display: flex; gap: 8px; overflow-x: auto; padding: 8px; background: var(--tray); scrollbar-width: thin; }
.part-btn { flex: 0 0 auto; width: 104px; padding: 6px 6px 7px; border-radius: 10px; border: 2px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07); color: #fff; text-align: center; }
.part-btn svg { width: 100%; height: 44px; display: block; }
.part-btn .pn { display: block; font: 500 12px/1.2 var(--font-mono); margin-top: 2px; }
.part-btn .ps { display: block; font-size: 10.5px; line-height: 1.2; opacity: .75; margin-top: 2px; }
.part-btn[aria-pressed="true"] { border-color: #ffd447; background: rgba(255, 212, 71, .18); }

/* Painel do passo */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; overflow: auto; max-height: 36dvh; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 2px 0 0; font: 700 25px/1.05 var(--font-display); text-wrap: balance; }
.panel p { margin: 0; max-width: 62ch; }
.todo { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; }
.todo b { display: block; font: 500 11px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.list h3 { margin: 0 0 3px; font: 500 11px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; min-height: 40px; }
button.row:hover { border-color: var(--accent); }
.row .ck { flex: 0 0 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; color: transparent; }
.row.done { background: var(--ok-soft); border-color: transparent; }
.row.done .ck { background: var(--ok); border-color: var(--ok); color: #fff; }
.row.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.row .arrow { color: var(--muted); }
.row .tx { min-width: 0; overflow-wrap: anywhere; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
details.why summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); }
details.why p { margin-top: 6px; }
details.dica { border: 1px dashed var(--line); border-radius: 9px; padding: 8px 10px; }
details.dica summary { cursor: pointer; font-weight: 600; font-size: 14px; }
details.dica p { margin-top: 6px; color: var(--muted); font-size: 14px; }
.nav { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; position: sticky; bottom: -14px; background: var(--surface); padding: 10px 0 2px; margin-top: auto; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 10px 16px; font-weight: 600; min-height: 42px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.nav .hint { grid-column: 1 / -1; order: 3; font-size: 12.5px; color: var(--muted); min-width: 0; }
.nav .primary { width: 100%; }

/* Fonte */
.psu { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.psu .disp { font: 500 30px/1 var(--font-mono); background: #0b1a12; color: #4cff9a; padding: 10px 14px; border-radius: 8px; min-width: 112px; text-align: center; letter-spacing: .04em; }
.psu .disp.over { color: #ff7a6e; }
.psu .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.psu .btns button { min-width: 52px; }
.msg { padding: 8px 10px; border-radius: 9px; font-size: 13.5px; }
.msg.ok { background: var(--ok-soft); color: var(--ok); }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.msg.bad { background: var(--bad-soft); color: var(--bad); }

/* Teste */
.test-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.big-sw { padding: 14px 8px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font: 700 22px/1 var(--font-display); letter-spacing: .04em; }
.big-sw small { display: block; font: 400 11.5px/1.2 var(--font-body); letter-spacing: 0; color: var(--muted); margin-top: 4px; }
.big-sw[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.big-sw[aria-pressed="true"] small { color: inherit; opacity: .85; }
.readout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.cell { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; min-width: 0; }
.cell .k { font: 500 11px/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.cell .v { font: 500 18px/1.3 var(--font-mono); font-variant-numeric: tabular-nums; }
.led-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; background: var(--line); }
.led-dot.g.on { background: #27c24c; box-shadow: 0 0 10px #27c24c; }
.led-dot.r.on { background: #e5392f; box-shadow: 0 0 10px #e5392f; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font: 500 12px/1 var(--font-mono); padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); color: var(--muted); }
.chip.on { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.table-test { width: 100%; border-collapse: collapse; font-size: 14px; }
.table-test td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
.table-test td:last-child { text-align: right; font-weight: 600; color: var(--ok); }
.q-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; font-size: 14px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 4px; width: 18px; height: 18px; }

/* Figura dos terminais */
.fig { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.fig svg { width: 150px; height: auto; flex: 0 0 auto; }

/* SVG da bancada */
.term-hit { fill: transparent; cursor: pointer; }
.term-dot { fill: #f1c75b; stroke: #7a5b00; stroke-width: 2; pointer-events: none; }
.term-lbl { fill: var(--silk); font: 500 10px var(--font-mono); text-anchor: middle; pointer-events: none; }
.silk { fill: var(--silk); font-family: var(--font-mono); pointer-events: none; }
.slot { fill: rgba(255,255,255,.05); stroke: rgba(255,255,255,.4); stroke-width: 2; stroke-dasharray: 6 5; }
.slot.want { stroke: #ffd447; stroke-width: 3; fill: rgba(255, 212, 71, .12); }
.slot.ready { cursor: pointer; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
@keyframes ringpulse { 0% { r: 11; opacity: 1; } 100% { r: 24; opacity: 0; } }
.ring-hint { fill: none; stroke: #ffd447; stroke-width: 4; animation: ringpulse 1.1s ease-out infinite; pointer-events: none; }
.ring-sel { fill: none; stroke: #fff; stroke-width: 4; pointer-events: none; }
.bar-hint { animation: pulse 1s ease-in-out infinite; }
.wire-hit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; pointer-events: stroke; }
@keyframes spincw { to { transform: rotate(360deg); } }
@keyframes spinccw { to { transform: rotate(-360deg); } }
.spin-cw { animation: spincw .9s linear infinite; }
.spin-ccw { animation: spinccw .9s linear infinite; }
.glow { filter: drop-shadow(0 0 7px currentColor); }
@media (prefers-reduced-motion: reduce) {
  .ring-hint, .bar-hint { animation: none; opacity: 1; }
  .spin-cw, .spin-ccw { animation: none; }
}

/* Telas largas */
@media (min-width: 900px) {
  .work { grid-template-columns: minmax(0, 1fr) 410px; grid-template-rows: minmax(0, 1fr); }
  .panel { max-height: none; }
  .work { grid-template-rows: minmax(0, 1fr); }
  h1 { font-size: 32px; }
}
@media (max-width: 520px) {
  h1 { font-size: 23px; }
  .eyebrow { display: none; }
  .top { flex-wrap: nowrap; }
  .link-btn .lbl { display: none; }
  .link-btn.armed .lbl { display: inline; }
  .link-btn { font-size: 15px; padding: 6px 12px; }
  .bar-title { display: none; }
  .bar { justify-content: flex-end; }
  .tbtn { min-width: 36px; padding: 0 9px; }
  .status { font-size: 12.5px; }
  .part-btn { width: 84px; padding: 3px 4px 4px; border-width: 2px; }
  .part-btn svg { height: 28px; }
  .part-btn .pn { font-size: 11px; margin-top: 0; }
  .part-btn .ps { display: none; }
  .tray { padding: 6px 8px; gap: 6px; }
}
</style>

<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">SELAN 2 · Atividade prática · Revisadeira</div>
      <h1>Montador de Ponte H</h1>
    </div>
    <div class="top-actions">
      <span class="pill" id="progress">Passo 1 de 13</span>
      <button class="link-btn" id="btnReset" type="button" aria-label="Recomeçar a montagem"><span class="ic">↺</span><span class="lbl">Recomeçar</span></button>
    </div>
  </header>

  <nav class="steps" id="steps" aria-label="Passos da montagem"></nav>

  <div class="work">
    <section class="stage" id="stage" aria-label="Bancada virtual">
      <div class="bar">
        <span class="bar-title">Bancada virtual</span>
        <div class="tools">
          <button class="tbtn" id="tHint" type="button" aria-pressed="true" title="Destacar a próxima ligação">Dica</button>
          <button class="tbtn" id="tZoomIn" type="button" aria-label="Aproximar">+</button>
          <button class="tbtn" id="tZoomOut" type="button" aria-label="Afastar">−</button>
          <button class="tbtn" id="tFit" type="button" title="Ver a bancada inteira">Tudo</button>
          <button class="tbtn" id="tUndo" type="button" title="Desfazer a última ação">Desfazer</button>
        </div>
      </div>
      <div class="canvas" id="canvas">
        <svg id="board" viewBox="0 0 760 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Bancada virtual com a ponte H"></svg>
        <div class="status" id="status" hidden></div>
        <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
      </div>
      <div class="tray" id="tray" hidden aria-label="Gaveta de peças"></div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>
<script>
/* ========= DADOS DO CIRCUITO: peças, terminais e redes elétricas =========
   Sistema de coordenadas do SVG: viewBox 0 0 760 1000.
   Cada peça tem um "slot" (lugar na bancada) e terminais com posição absoluta. */

const BOARD = { w: 760, h: 1000 };

/* Tipos de peça que existem na gaveta */
const TYPES = {
  TIP122: { name: 'TIP122',          sub: 'transistor de potência', kind: 'tr220' },
  BC337:  { name: 'BC337',           sub: 'transistor pequeno',     kind: 'tr92'  },
  R470:   { name: '470 Ω',           sub: 'amarelo · violeta · marrom',   kind: 'res', bands: ['#e8c200', '#7a3fb0', '#7b4a1e'] },
  R1K:    { name: '1 kΩ',            sub: 'marrom · preto · vermelho',    kind: 'res', bands: ['#7b4a1e', '#111111', '#d02020'] },
  R2K2:   { name: '2,2 kΩ',          sub: 'vermelho · vermelho · vermelho', kind: 'res', bands: ['#d02020', '#d02020', '#d02020'] },
  R4K7:   { name: '4,7 kΩ',          sub: 'amarelo · violeta · vermelho', kind: 'res', bands: ['#e8c200', '#7a3fb0', '#d02020'] },
  R10K:   { name: '10 kΩ',           sub: 'marrom · preto · laranja',     kind: 'res', bands: ['#7b4a1e', '#111111', '#e8761a'] },
  LEDV:   { name: 'LED verde',       sub: 'indica FRENTE',          kind: 'led', color: '#27c24c' },
  LEDR:   { name: 'LED vermelho',    sub: 'indica RÉ',              kind: 'led', color: '#e5392f' },
  MOTOR:  { name: 'Motor DC 3–6 V',  sub: 'mini motor da revisadeira', kind: 'motor' },
  BOTAO:  { name: 'Botão',           sub: 'push button',            kind: 'sw' },
  FONTE:  { name: 'Fonte',           sub: '7,5 V',                  kind: 'psu' }
};

/* Ordem em que os tipos aparecem na gaveta */
const BIN_ORDER = ['TIP122', 'BC337', 'R470', 'R1K', 'R2K2', 'R4K7', 'R10K', 'LEDV', 'LEDR', 'MOTOR', 'BOTAO'];

/* Peças (slots). cx, cy = centro do corpo. terms = {terminal: [x, y]} */
const PARTS = {
  J1: { type: 'FONTE',  cx: 440, cy: 38,  pre: true,  terms: { pos: [415, 82], neg: [465, 82] } },

  SW1: { type: 'BOTAO', cx: 125, cy: 207, caption: 'FRENTE', terms: { a: [105, 170], b: [145, 170] } },
  SW2: { type: 'BOTAO', cx: 635, cy: 207, caption: 'RÉ',     terms: { a: [615, 170], b: [655, 170] } },

  Q1: { type: 'TIP122', cx: 235, cy: 340, terms: { B: [201, 400], C: [235, 400], E: [269, 400] } },
  Q2: { type: 'TIP122', cx: 525, cy: 340, terms: { B: [491, 400], C: [525, 400], E: [559, 400] } },
  Q3: { type: 'TIP122', cx: 235, cy: 820, terms: { B: [201, 880], C: [235, 880], E: [269, 880] } },
  Q4: { type: 'TIP122', cx: 525, cy: 820, terms: { B: [491, 880], C: [525, 880], E: [559, 880] } },

  R1: { type: 'R1K',  cx: 125, cy: 450, terms: { in: [80, 450],  out: [170, 450] } },
  R2: { type: 'R1K',  cx: 635, cy: 450, terms: { out: [590, 450], in: [680, 450] } },
  R3: { type: 'R4K7', cx: 110, cy: 880, terms: { in: [65, 880],  out: [155, 880] } },
  R4: { type: 'R4K7', cx: 650, cy: 880, terms: { out: [605, 880], in: [695, 880] } },

  Q5: { type: 'BC337', cx: 125, cy: 540, terms: { C: [95, 580],  B: [125, 580], E: [155, 580] } },
  Q6: { type: 'BC337', cx: 635, cy: 540, terms: { C: [605, 580], B: [635, 580], E: [665, 580] } },

/* ========= MOTOR DA MONTAGEM: estado, fios, validação e simulação ========= */

const state = {
  step: 0,
  placed: {},          // slot -> chave do tipo colocado (ex.: Q1 -> 'TIP122')
  wires: [],           // [{a, b}]
  history: [],         // desfazer: {t:'part', slot} | {t:'wire', a, b}
  vsrc: 5.0,           // tensão ajustada na fonte
  tested: { none: false, fre: false, re: false, both: false },
  noInterlock: false   // experimento virtual do passo de teste
};

/* ---------- Mapas de consulta ---------- */
const DOT = {};      // id do ponto de trilho -> {rail, x, y}
const TRUTH = {};    // id de terminal -> chave da rede correta
Object.keys(RAILS).forEach(r => RAILS[r].dots.forEach(([id, x, y]) => { DOT[id] = { rail: r, x, y }; TRUTH[id] = r; }));
Object.keys(NETS).forEach(n => NETS[n].terms.forEach(t => { TRUTH[t] = n; }));

function isDot(id) { return Object.prototype.hasOwnProperty.call(DOT, id); }
function partOf(id) { return id.split('.')[0]; }
function termOf(id) { return id.split('.')[1]; }
function isVisible(id) {
  if (isDot(id)) return true;
  const p = partOf(id);
  return !!PARTS[p] && (PARTS[p].pre || !!state.placed[p]);
}
function pos(id) {
  if (isDot(id)) return [DOT[id].x, DOT[id].y];
  return PARTS[partOf(id)].terms[termOf(id)];
}
function kindKey(type) {
  const k = TYPES[type].kind;
  return { tr220: 'TIP122', tr92: 'BC337', psu: 'fonte' }[k] || k;
}
function nameOf(id) {
  if (RAILS[id]) return 'trilho ' + RAILS[id].label;
  if (isDot(id)) return 'trilho ' + RAILS[DOT[id].rail].label;
  const p = partOf(id), t = termOf(id);
  const lbl = TERM_LABEL[kindKey(PARTS[p].type)][t];
  return p + ' · ' + lbl;
}
/* ponto de um trilho mais próximo de um terminal (para focar e destacar) */
function nearestDot(rail, fromId) {
  const [fx, fy] = pos(fromId);
  let best = null, bd = 1e9;
  RAILS[rail].dots.forEach(([id, x, y]) => {
    const d = Math.abs(x - fx) + Math.abs(y - fy);
    if (d < bd) { bd = d; best = id; }
  });
  return best;
}

/* ---------- Conectividade (união de conjuntos) ---------- */
function norm(id) { return RAILS[id] ? 'RAIL:' + id : (isDot(id) ? 'RAIL:' + DOT[id].rail : id); }
function buildDSU() {
  const parent = {};
  const find = x => { parent[x] = parent[x] || x; while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  state.wires.forEach(w => { const ra = find(norm(w.a)), rb = find(norm(w.b)); if (ra !== rb) parent[ra] = rb; });
  return find;
}
function connected(a, b) { const f = buildDSU(); return f(norm(a)) === f(norm(b)); }

/* ---------- Colocar peça ---------- */
function placePart(slot, typeKey) {
  const need = PARTS[slot].type;
  if (PARTS[slot].pre) return { ok: false, msg: 'A fonte já está na bancada.' };
  if (state.placed[slot]) return { ok: false, msg: slot + ' já tem uma peça. Use “Desfazer” se quiser trocar.' };
  if (need !== typeKey) {
    const n = TYPES[need], c = TYPES[typeKey];
    let msg = 'O lugar ' + slot + ' pede ' + n.name + ' (' + n.sub + '). Você escolheu ' + c.name + ' (' + c.sub + ').';
    if (n.kind === 'res' && c.kind === 'res') msg += ' Confira a ordem das faixas de cor.';
    return { ok: false, msg };
  }
  state.placed[slot] = typeKey;
  state.history.push({ t: 'part', slot });
  return { ok: true };
}

/* ---------- Criar fio ---------- */
function tryWire(a, b) {
  if (a === b) return { ok: false, msg: 'Escolha dois terminais diferentes.' };
  const aDot = isDot(a), bDot = isDot(b);
  if (!aDot && !bDot && partOf(a) === partOf(b)) {
    return { ok: false, msg: 'Os dois terminais são da mesma peça (' + partOf(a) + '). Ligar um no outro faria um curto dentro dela.' };
  }
  const na = TRUTH[a], nb = TRUTH[b];
  if (na !== nb) {
    const pair = [na, nb].sort().join('+');
    if (pair === 'GND+VCC') {
      return { ok: false, short: true, msg: 'CURTO-CIRCUITO. Isso ligaria o +7,5 V direto no GND. Na bancada, a fonte desligaria ou algo esquentaria muito. Escolha outro destino.' };
    }
    const mates = NETS[na] ? NETS[na].terms.filter(t => t !== a && isVisible(t)).slice(0, 4).map(nameOf) : [];
    if (NETS[na] && NETS[na].rail) mates.unshift('trilho ' + RAILS[NETS[na].rail].label);
    let msg = nameOf(a) + ' pertence ao ' + NETS[na].label + ', e ' + nameOf(b) + ' pertence ao ' + NETS[nb].label + '. Esses dois pontos não se ligam no circuito.';
    if (mates.length) msg += ' Esse terminal se liga com: ' + mates.join('; ') + '.';
    return { ok: false, msg };
  }
  if (connected(a, b)) return { ok: false, msg: 'Esses dois pontos já estão ligados, direto ou por outro fio.' };
  state.wires.push({ a, b });
  state.history.push({ t: 'wire', a, b });
  return { ok: true };
}

function removeWireAt(i) { state.wires.splice(i, 1); }

/* ---------- Desfazer ---------- */
function undo() {
  const h = state.history.pop();
  if (!h) return null;
  if (h.t === 'wire') {
    const i = state.wires.findIndex(w => w.a === h.a && w.b === h.b);
    if (i >= 0) state.wires.splice(i, 1);
    return 'Fio removido.';
  }
  delete state.placed[h.slot];
  state.wires = state.wires.filter(w => !(w.a.startsWith(h.slot + '.') || w.b.startsWith(h.slot + '.')));
  state.history = state.history.filter(x => x.t !== 'wire' || state.wires.some(w => w.a === x.a && w.b === x.b));
  return h.slot + ' retirado, junto com os fios ligados a ele.';
}

function resetAll() {
  state.step = 0; state.placed = {}; state.wires = []; state.history = []; state.vsrc = 5.0;
  state.tested = { none: false, fre: false, re: false, both: false }; state.noInterlock = false;
}

/* ---------- Estado dos passos ---------- */
function itemDone(it) {
  if (!isVisible(it.from)) return false;
  if (!RAILS[it.to] && !isVisible(it.to)) return false;
  return connected(it.from, it.to);
}
function stepStatus(i) {
  const s = STEPS[i];
  const placeDone = s.place.map(sl => state.placed[sl] === PARTS[sl].type);
  const items = s.items.map(itemDone);
  const extraOk = s.extra === 'fonte' ? Math.abs(state.vsrc - 7.5) < 0.01 : true;
  const complete = placeDone.every(Boolean) && items.every(Boolean) && extraOk;
  return { placeDone, items, extraOk, complete };
}
function firstPending(i) {
  const s = STEPS[i], st = stepStatus(i);
  const sl = s.place.find((_, k) => !st.placeDone[k]);
  if (sl) return { kind: 'place', slot: sl };
  const k = st.items.findIndex(d => !d);
  if (k >= 0) return { kind: 'wire', item: s.items[k], index: k };
  return null;
}
function allBuilt() { return STEPS.slice(1, STEPS.length - 1).every((_, k) => stepStatus(k + 1).complete); }

/* ---------- Simulação (circuito completo) ---------- */
const VCE_SAT = 1.1;
function simulate(fre, re) {
  const inter = !state.noInterlock;
  const vs = 7.5;
  const q = {
    Q1: fre && !(re && inter),
    Q2: re && !(fre && inter),
    Q3: re,
    Q4: fre,
    Q5: re && inter,
    Q6: fre && inter
  };
  const out = { q, vs, inter, fre, re };
  // curto: dois transistores do mesmo lado conduzindo juntos
  if ((q.Q1 && q.Q3) || (q.Q2 && q.Q4)) {
    out.motor = 'curto'; out.ledV = false; out.ledR = false; out.vMotor = 0;
    out.vce = { Q1: VCE_SAT, Q2: VCE_SAT, Q3: VCE_SAT, Q4: VCE_SAT };
    out.msg = 'CURTO: Q1 e Q3 (e também Q2 e Q4) conduzem juntos e ligam o +7,5 V direto no GND. Sem Q5 e Q6, apertar os dois botões queima a ponte.';
    return out;
  }
  let VA, VB;
  if (q.Q1 && q.Q4)      { out.motor = 'horario';     VA = vs - VCE_SAT; VB = VCE_SAT; }

/* ---------- Fios ---------- */
function wirePath(a, b) {
  const [x1, y1] = pos(a), [x2, y2] = pos(b);
  const dx = x2 - x1, dy = y2 - y1;
  let c1, c2;
  if (Math.abs(dy) >= Math.abs(dx) * 0.6) {
    const s = dy >= 0 ? 1 : -1, h = Math.min(160, Math.abs(dy) * 0.5 + 24);
    let bulge = 0;
    if (Math.abs(dy) > 320) bulge = (x1 + x2) / 2 < 380 ? -60 : 60;
    c1 = [x1 + bulge, y1 + s * h]; c2 = [x2 + bulge, y2 - s * h];
  } else {
    const s = dx >= 0 ? 1 : -1, h = Math.min(140, Math.abs(dx) * 0.5 + 24);
    c1 = [x1 + s * h, y1 + 20]; c2 = [x2 - s * h, y2 + 20];

}

/* ---------- Renderização completa ---------- */
function renderBoard() {

  // slots vazios
  Object.keys(PARTS).forEach(slot => {
    const p = PARTS[slot];
    if (p.pre || state.placed[slot]) return;

    const r = el('rect', { x: b.x, y: b.y, width: b.w, height: b.h, rx: 10, class: 'slot' + (want ? ' want' : '') + (ready ? ' ready' : '') }, g);

    txt(g, p.cx, p.cy + 20, TYPES[p.type].name, { size: 11, op: want ? .95 : .5 });
  });
  // peças
  Object.keys(PARTS).forEach(slot => {

  // fios

    Object.keys(PARTS[slot].terms).forEach(t => drawTerm(slot + '.' + t, true));

  if (ui.hints && hintIds.length) hintIds.forEach(id => ring(id, 'ring-hint'));

}

/* ---------- Visual do teste (motor girando, LEDs, transistores) ---------- */

  document.querySelectorAll('[data-body]').forEach(e => {

/* ---------- Câmera (viewBox) com foco automático ---------- */
let vb = { x: 0, y: 0, w: BOARD.w, h: BOARD.h }, vbAnim = 0;

  const x1 = Math.max(...bs.map(b => b.x + b.w)) + 30, y1 = Math.max(...bs.map(b => b.y + b.h)) + 30;

  let s = '<svg viewBox="0 0 100 48" aria-hidden="true">';

  zoomBy(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

function updateUndoLabel() { $('tUndo').textContent = ui.selWire >= 0 ? 'Remover fio' : 'Desfazer'; }

/* ---------- Barra de ferramentas ---------- */
$('tZoomIn').addEventListener('click', () => { cancelAnimationFrame(vbAnim); zoomBy(1.35); });
$('tZoomOut').addEventListener('click', () => { cancelAnimationFrame(vbAnim); zoomBy(1 / 1.35); });
$('tFit').addEventListener('click', fitAll);
$('tUndo').addEventListener('click', () => { undoAction(); updateUndoLabel(); });
$('tHint').addEventListener('click', () => { ui.hints = !ui.hints; $('tHint').setAttribute('aria-pressed', ui.hints); renderBoard(); });
let resetArmed = 0;
$('btnReset').addEventListener('click', () => {
  const b = $('btnReset');
  const lbl = b.querySelector('.lbl');
  if (!resetArmed) { lbl.textContent = 'Apagar tudo? Toque de novo'; b.classList.add('armed'); resetArmed = setTimeout(() => { resetArmed = 0; lbl.textContent = 'Recomeçar'; b.classList.remove('armed'); }, 4000); return; }
  clearTimeout(resetArmed); resetArmed = 0; lbl.textContent = 'Recomeçar'; b.classList.remove('armed');
  resetAll(); ui.sel = null; ui.selType = null; ui.selWire = -1; ui.press = { fre: false, re: false }; clearLocal();
  setStatus(null); toastEl.hidden = true; refresh(); autoFocus();
});
let rz = 0;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(autoFocus, 150); });

/* ---------- Início ---------- */
initBoard();
loadLocal();
if (state.step === LAST && !allBuilt()) state.step = 1;
if (!reachable(state.step)) state.step = 1;
refresh();
setTimeout(() => { vb = viewFor({ x: 0, y: 0, w: BOARD.w, h: BOARD.h }, 1.2); applyVB(); autoFocus(); }, 60);
window.__app = { state, ui, tryWire, placePart, goStep, refresh, STEPS, stepStatus, attemptWire, onSlotTap, simulate };
</script>

</body>
</html>
